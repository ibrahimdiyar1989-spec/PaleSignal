name: PaleSignal
options:
  deploymentTarget:
    iOS: "16.0"
  bundleIdPrefix: com.palesignal

targets:
  PaleSignal:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palesignal.game
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
