name: Build PaleSignal IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild \
            -project PaleSignal.xcodeproj \
            -scheme PaleSignal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/PaleSignal.app Payload/
          zip -r PaleSignal.ipa Payload

      - name: Upload PaleSignal.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaleSignal-iOS
          path: PaleSignal.ipa
